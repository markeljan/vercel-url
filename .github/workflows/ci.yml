name: Checks
on:
  push:
    branches: [main, 'factory/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run lint
      - run: ./node_modules/.bin/tsc --noEmit --emitDeclarationOnly false
      - run: bun run build
      - name: Verify checked-in dist matches the real package build
        run: git diff --exit-code -- dist
      - run: bun src/development-regression.ts
      - run: bun src/development-regression.ts --bundle
      - name: Verify checks left source unchanged
        run: test -z "$(git status --porcelain)"
